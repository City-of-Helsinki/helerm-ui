# Don't allow dependencies to be used before they have been released for at least 1 week
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@babel/helpers@7.29.10"
  - "@babel/traverse@7.29.10"
  - baseline-browser-mapping@2.11.28
  - caniuse-lite@1.0.30001815
  - electron-to-chromium@1.5.452
  - nanoid@3.3.20
  - node-releases@2.0.58
  - update-browserslist-db@1.3.4


# Don't warn about ignored build scripts
ignoredBuiltDependencies: []

# Hoist all dependencies to the root of node_modules, for better compatibility with packages that expect flat node_modules
shamefullyHoist: true

overrides:
  'brace-expansion': '>=5.0.12'
  'minimatch': '^10.2.4'
  'tmp': '>=0.2.6'
  'immutable': '>=4.3.9'
  'fast-uri': '>=4.1.5'
  'undici': '^7.29.1'
  'js-yaml': '>=4.3.1'
  'postcss': '>=8.5.18'
  'ajv@>=7': '^8.18.0'
  'source-map-js': '>=1.2.2'
  '@humanfs/node': '^0.16.8'
  'exceljs>uuid': '^11.1.1'
  'esrun>esbuild': '^0.25.0'
  'esrun>chokidar': '^4.0.3'

allowBuilds:
  esbuild: true
  unrs-resolver: true
